name: Build and Test

on: [push, pull_request]

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        preset: [ogl-debug, ogl-release, soft-release, menu-release]

    steps:
    - uses: actions/checkout@v4

    # The engine is 32-bit only (Hunt/Memory.h asserts sizeof(void*) == 4;
    # the software renderer contains x86 inline assembly). windows-latest
    # defaults to the x64 toolchain, which makes every translation unit fail
    # to compile, so the x86 environment must be selected explicitly.
    - name: Set up x86 MSVC toolchain
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x86

    - name: Configure CMake
      run: cmake --preset ${{ matrix.preset }}

    - name: Build
      run: cmake --build --preset ${{ matrix.preset }}

    - name: Smoke Test (GL only)
      if: matrix.preset == 'ogl-release'
      shell: powershell
      run: |
        & ./tests/smoke_test.ps1 -ExePath build/ogl-release/bin/Carnivores1_GL.exe -Duration 10

    - name: Unit Tests (debug builds)
      if: matrix.preset == 'ogl-debug'
      shell: powershell
      run: |
        cd build/ogl-debug
        ctest --output-on-failure

    - name: Memory Leak Report (debug)
      if: matrix.preset == 'ogl-debug'
      shell: powershell
      run: |
        & ./tests/smoke_test.ps1 -ExePath build/ogl-debug/bin/Carnivores1_GL.exe -Duration 10
        Select-String -Path carnivor.log -Pattern "No memory leaks detected"
        if ($LASTEXITCODE -ne 0) { throw "Memory leaks detected!" }
