name: Build and Test

# Normal pushes and pull requests get one clean debug build and the unit-test
# suite. That is the only automatic gate: it proves the committed tree builds
# from scratch and that the tests pass without local build state.
#
# The release presets are a manual pre-release gate. They are slower (release
# LTO, shipping tests) and only need to run when a package is being prepared.
# Tags and releases do not trigger this workflow.
on:
  push:
    branches: [main]
    tags-ignore: ['**']
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

# Keep PR and main checks separate; newer updates supersede older runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # One clean checkout, one debug build, all CTest suites. This catches a
  # missing committed file, a stale local cache, and test regressions without
  # spending four Windows runners on every change.
  verify:
    if: github.event_name != 'workflow_dispatch'
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    # The engine is 32-bit only (Hunt/Memory.h asserts sizeof(void*) == 4;
    # the software renderer contains x86 inline assembly). windows-latest
    # defaults to the x64 toolchain, which makes every translation unit fail
    # to compile, so the x86 environment must be selected explicitly.
    - name: Set up x86 MSVC toolchain
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x86

    - name: Configure debug build
      run: cmake --preset ogl-debug -DC2_BUILD_TESTS=ON

    - name: Build and check warnings
      shell: powershell
      run: |
        $ErrorActionPreference = 'Stop'
        $log = 'build-ogl-debug.log'
        cmake --build --preset ogl-debug 2>&1 | Tee-Object -FilePath $log
        $buildExit = $LASTEXITCODE
        if ($buildExit -ne 0) { exit $buildExit }
        ./tools/check_msvc_warnings.ps1 -Log $log -Preset 'ogl-debug'

    - name: Upload build log
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-log-ogl-debug
        path: build-ogl-debug.log
        if-no-files-found: ignore

    - name: Unit tests
      run: ctest --test-dir build/ogl-debug --output-on-failure

  # Run this from the Actions page before packaging. It verifies the exact
  # shipping preset used by the packaging script, including its test targets,
  # and still compiles the software and menu releases.
  release-matrix:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: ogl-release-shipping
            build_tests: 'ON'
            run_tests: true
          - preset: soft-release
            build_tests: 'OFF'
            run_tests: false
          - preset: menu-release
            build_tests: 'OFF'
            run_tests: false

    steps:
    - uses: actions/checkout@v4

    - name: Set up x86 MSVC toolchain
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x86

    - name: Configure release build
      run: cmake --preset ${{ matrix.preset }} -DC2_BUILD_TESTS=${{ matrix.build_tests }}

    - name: Build and check warnings
      shell: powershell
      run: |
        $ErrorActionPreference = 'Stop'
        $log = 'build-${{ matrix.preset }}.log'
        cmake --build --preset ${{ matrix.preset }} 2>&1 | Tee-Object -FilePath $log
        $buildExit = $LASTEXITCODE
        if ($buildExit -ne 0) { exit $buildExit }
        ./tools/check_msvc_warnings.ps1 -Log $log -Preset '${{ matrix.preset }}'

    - name: Upload build log
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-log-${{ matrix.preset }}
        path: build-${{ matrix.preset }}.log
        if-no-files-found: ignore

    - name: Check release stack protection
      shell: powershell
      run: ./tools/check_release_flags.ps1 -BuildDir build/${{ matrix.preset }}

    - name: Unit tests
      if: matrix.run_tests
      run: ctest --test-dir build/${{ matrix.preset }} --output-on-failure
